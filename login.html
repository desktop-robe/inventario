<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body {
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f3f4f6;
    }

    .login {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 250px;
    }

    input {
      width: 100%;
      margin: 10px 0;
      padding: 8px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #16a34a;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="login">
  <h2>Login</h2>
  <input type="text" id="user" placeholder="Usuario">
  <input type="password" id="pass" placeholder="Contraseña">
  <button onclick="login()">Ingresar</button>
  <p id="msg"></p>
</div>

<script>
function login() {
  const user = document.getElementById("user").value;
  const pass = document.getElementById("pass").value;
  const msg = document.getElementById("msg");

  if(user === "admin" && pass === "1234"){
    msg.style.color = "green";
    msg.textContent = "Login correcto";
  } else {
    msg.style.color = "red";
    msg.textContent = "Credenciales incorrectas";
  }
}
</script>

</body>
</html>
